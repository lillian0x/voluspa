apiVersion: v1
kind: ConfigMap
metadata:
  name: miniflux-config
  namespace: miniflux
data:
  RUN_MIGRATIONS: "1"
  CREATE_ADMIN: "1"
  OAUTH2_PROVIDER: oidc
  OAUTH2_CLIENT_ID: 5cec176e-8d48-4d64-bca2-e9c15afd70e7
