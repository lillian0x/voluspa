apiVersion: apps/v1
kind: Deployment
metadata:
  name: vikunja
  namespace: vikunja
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vikunja
  template:
    metadata:
      labels:
        app: vikunja
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: vikunja
          image: vikunja/vikunja:latest
          ports:
            - containerPort: 3456
          envFrom:
            - confifMapRef:
                name: vikunja-config
            - secretRef:
                name: vikunja-secret
          volumeMounts:
            - mountPath: /db
              name: vikunja-data
            - mountPath: /app/vikunja/files
              name: vikunja-files
      volumes:
        - name: vikunja-data
          persistentVolumeClaim:
            claimName: vikunja-data-pvc
        - name: vikunja-files
          persistentVolumeClaim:
            claimName: vikunja-files-pvc
