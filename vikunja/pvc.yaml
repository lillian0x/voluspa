apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vikunja-data-pvc
  namespace: vikunja
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 7Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vikunja-files-pvc
  namespace: vikunja
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 7Gi
