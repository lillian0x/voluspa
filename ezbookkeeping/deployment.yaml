apiVersion: apps/v1
kind: Deployment
metadata:
  name: "ezbookkeeping"
  namespace: "ezbookkeeping"
spec:
  selector:
    matchLabels:
      app: "ezbookkeeping"
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: "ezbookkeeping"
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - image: "mayswind/ezbookkeeping:1.5.0"
          name: "ezbookkeeping"
          envFrom:
            - configMapRef:
                name: ezbookkeeping-config
            - secretRef:
                name: ezbookkeeping-secret
          env:
            - name: EBK_DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: ezbookkeeping-credentials
                  key: username
            - name: EBK_DATABASE_PASSWD
              valueFrom:
                secretKeyRef:
                  name: ezbookkeeping-credentials
                  key: password
          ports:
            - containerPort: 8080
              name: ezbookkeeping
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "2"
          volumeMounts:
            - mountPath: "/ezbookkeeping/storage" # User uploads storage
              name: "ezbookkeeping-storage"
      volumes:
        - name: "ezbookkeeping-storage"
          persistentVolumeClaim:
            claimName: "ezbookkeeping-storage-pvc"
