apiVersion: apps/v1
kind: Deployment
metadata:
  name: "ezbookkeeping"
  namespace: "ezbookkeeping"
spec:
  selector:
    matchLabels:
      app: "ezbookkeeping"
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: "ezbookkeeping"
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - image: "mayswind/ezbookkeeping:1.5.0"
        name: "ezbookkeeping"
        env:
        - name: EBK_SECURITY_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: "ezbookkeeping-secret"
              key: EBK_SECURITY_SECRET_KEY
        - name: EBK_SERVER_ENABLE_GZIP
          value: "true"
        - name: EBK_LOG_MODE
          value: "console" # Logs are collected from stdout/stderr in Kubernetes and can be accessed via "kubectl logs"
        - name: EBK_SERVER_DOMAIN
          value: "ezbookkeeping.lillian0x.com"
        - name: EBK_SERVER_ROOT_URL
          value: "https://ezbookkeeping.lillian0x.com"
        - name: EBK_AUTH_ENABLE_OAUTH2_AUTH
          value: "true"
        - name: EBK_AUTH_OAUTH2_PROVIDER
          value: "oidc"
        - name: EBK_AUTH_OAUTH2_CLIENT_ID
          value: "468bb888-f680-4a8f-ad20-4c85be3ab3c1"
        - name: EBK_AUTH_OAUTH2_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: "ezbookkeeping-secret"
              key: EBK_AUTH_OAUTH2_CLIENT_SECRET
        - name: EBK_AUTH_OIDC_PROVIDER_BASE_URL
          value: "https://auth.lillian0x.com"
        - name: EBK_AUTH_ENABLE_OIDC_DISPLAY_NAME
          value: "true"
        - name: EBK_AUTH_OIDC_CUSTOM_DISPLAY_NAME
          value: "Pocket ID"
        - name: EBK_AUTH_OAUTH2_USE_PKCE
          value: "true"
        ports:
        - containerPort: 8080
          name: ezbookkeeping
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "2"
        volumeMounts:
        - mountPath: "/ezbookkeeping/data" # SQLite database storage
          name: "ezbookkeeping-data"
        - mountPath: "/ezbookkeeping/storage" # User uploads storage
          name: "ezbookkeeping-storage"
      volumes:
        - name: "ezbookkeeping-data"
          persistentVolumeClaim:
            claimName: "ezbookkeeping-data-pvc"
        - name: "ezbookkeeping-storage"
          persistentVolumeClaim:
            claimName: "ezbookkeeping-storage-pvc"
