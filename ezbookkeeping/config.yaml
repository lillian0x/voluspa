apiVersion: v1
kind: ConfigMap
metadata:
  name: ezbookkeeping-config
  namespace: ezbookkeeping
data:
  EBK_LOG_MODE: "console"
  EBK_USER_ENABLE_REGISTER: "true"
  EBK_DATABASE_TYPE: "postgres"
  EBK_DATABASE_HOST: "postgres-cluster-rw.postgres.svc.cluster.local:5432"
  EBK_SERVER_ENABLE_GZIP: "true"
  EBK_SERVER_DOMAIN: "ezbookkeeping.lillian0x.com"
  EBK_SERVER_ROOT_URL: "https://ezbookkeeping.lillian0x.com"
  EBK_AUTH_ENABLE_INTERNAL_AUTH: "false"
  EBK_AUTH_ENABLE_OAUTH2_AUTH: "true"
  EBK_AUTH_OAUTH2_PROVIDER: "oidc"
  EBK_AUTH_OAUTH2_CLIENT_ID: "468bb888-f680-4a8f-ad20-4c85be3ab3c1"
  EBK_AUTH_OAUTH2_USE_PKCE: "true"
  EBK_AUTH_OIDC_PROVIDER_BASE_URL: "https://auth.lillian0x.com"
  EBK_AUTH_OIDC_CUSTOM_DISPLAY_NAME: "Pocket ID"
  EBK_AUTH_ENABLE_OIDC_DISPLAY_NAME: "true"
