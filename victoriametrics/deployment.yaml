apiVersion: apps/v1
kind: Deployment
metadata:
  name: victoria-metrics
  namespace: victoria-metrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: victoria-metrics
  template:
    metadata:
      labels:
        app: victoria-metrics
    spec:
      containers:
        - name: victoria-metrics
          image: victoriametrics/victoria-metrics:latest
          args:
            - "-storageDataPath=/storage"
            - "-retentionPeriod=1"
            - "-httpListenAddr=:8428"
          ports:
            - containerPort: 8428
              name: http
          volumeMounts:
            - mountPath: /storage
              name: vm-storage
      volumes:
        - name: vm-storage
          persistentVolumeClaim:
            claimName: vm-data
