apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-cluster
  namespace: postgres
spec:
  instances: 1
  storage:
    size: 20Gi
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "1Gi"
  bootstrap:
    initdb:
      database: appdb
      owner: appuser
  managed:
    roles:
      - name: ezbookkeeping
        ensure: present
        login: true
        passwordSecret:
          name: ezbookkeeping-credentials
      - name: vikunja
        ensure: present
        login: true
        passwordSecret:
          name: vikunja-credentials
      - name: miniflux
        ensure: present
        login: true
        passwordSecret:
          name: miniflux-credentials
