apiVersion: batch/v1
kind: CronJob
metadata:
  name: homelab-pg-backup
  namespace: postgres
spec:
  schedule: "0 3 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: pg-dump
              image: ghcr.io/cloudnative-pg/postgresql:17
              command:
                - /bin/bash
                - -c
                - >
                  pg_dump -h homelab-pg-rw -U appuser -d appdb -F c
                  -f /backup/appdb-$(date +%Y%m%d-%H%M%S).dump
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: homelab-pg-app
                      key: password
              volumeMounts:
                - name: backup-vol
                  mountPath: /backup
          restartPolicy: OnFailure
          volumes:
            - name: backup-vol
              persistentVolumeClaim:
                claimName: pg-backup-storage
