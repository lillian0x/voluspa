apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-pg-from-services
  namespace: postgres
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: postgres-cluster
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ezbookkeeping
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vikunja
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: miniflux
      ports:
        - protocol: TCP
          port: 5432
