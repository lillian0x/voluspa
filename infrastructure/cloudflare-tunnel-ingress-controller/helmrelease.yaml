apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudflare-tunnel-ingress-controller
  namespace: cloudflare-tunnel-system
spec:
  interval: 30m
  chart:
    spec:
      chart: cloudflare-tunnel-ingress-controller
      sourceRef:
        kind: HelmRepository
        name: cloudflare-tunnel
      interval: 1h
  values:
    cloudflare:
      secretRef:
        name: cloudflare-tunnel-credentials
        accountIDKey: account_id
        tunnelNameKey: tunnel_name
        apiTokenKey: api_token
    ingressClass:
      name: cloudflare-tunnel
      isDefaultClass: false
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - "ALL"
    cloudflared:
      image:
        repository: cloudflare/cloudflared
        tag: 2026.10.3
      replicaCount: 2
      podAntiAffinity: true
      pdb:
        enabled: true
        minAvailable: 1
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - "ALL"
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 256Mi
    serviceMonitor:
      create: true
