apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 30m

  chart:
    spec:
      chart: kube-prometheus-stack
      version: "88.x"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community

  values:
    grafana:
      enabled: true

    prometheus:
      prometheusSpec:
        retention: 15d

    alertmanager:
      enabled: true
