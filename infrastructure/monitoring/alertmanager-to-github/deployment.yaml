apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager-to-github
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alertmanager-to-github
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alertmanager-to-github
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alertmanager-to-github
          image: ghcr.io/pfnet-research/alertmanager-to-github:v0.3.1
          resources:
            requests:
              cpu: 1m
              memory: 24Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: ATG_LISTEN
              value: ':8080'
            - name: ATG_GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: alertmanager-to-github
                  key: ATG_GITHUB_TOKEN
          livenessProbe:
            httpGet:
              path: /metrics
              port: 8080
