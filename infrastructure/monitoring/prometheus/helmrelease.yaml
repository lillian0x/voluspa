apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 88.6.1
      sourceRef:
        kind: HelmRepository
        name: prometheus
  values:
    grafana:
      enabled: false
