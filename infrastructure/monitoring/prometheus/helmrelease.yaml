apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: prometheus
      version: 29.27.0
      sourceRef:
        kind: HelmRepository
        name: prometheus
  value:
    server:
      retention: 15d
