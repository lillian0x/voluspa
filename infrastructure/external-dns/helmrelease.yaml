apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
  namespace: external-dns
spec:
  interval: 1h
  chart:
    spec:
      chart: external-dns
      version: 1.23.0
      sourceRef:
        kind: HelmRepository
        name: external-dns
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    provider:
      name: webhook
      webhook:
        image:
          repository: ghcr.io/muhlba91/external-dns-provider-adguard
          tag: v11.2.0
        env:
          - name: ADGUARD_URL
            valueFrom:
              secretKeyRef: {name: adguard-configuration, key: url}
          - name: ADGUARD_USER
            valueFrom:
              secretKeyRef: {name: adguard-configuration, key: user}
          - name: ADGUARD_PASSWORD
            valueFrom:
              secretKeyRef: {name: adguard-configuration, key: password}
          - name: SERVER_HOST
            value: "0.0.0.0"
    sources:
      - service
      - ingress
    policy: upsert-only # 動作確認後に sync へ
    registry: txt
    txtOwnerId: k3s
    domainFilters:
      - home.example.com
