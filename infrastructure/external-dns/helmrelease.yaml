apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
  namespace: external-dns
spec:
  interval: 1h
  chart:
    spec:
      chart: external-dns
      version: 1.23.0
      sourceRef:
        kind: HelmRepository
        name: external-dns
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {memory: 128Mi}
    provider:
      name: webhook
      webhook:
        image:
          repository: ghcr.io/muhlba91/external-dns-provider-adguard
          tag: v11.2.0
        resources:
          requests: {cpu: 10m, memory: 32Mi}
          limits: {memory: 128Mi}
        env:
          - name: ADGUARD_URL
            valueFrom:
              secretKeyRef: {name: adguard-configuration, key: url}
          - name: ADGUARD_USER
            valueFrom:
              secretKeyRef: {name: adguard-configuration, key: user}
          - name: ADGUARD_PASSWORD
            valueFrom:
              secretKeyRef: {name: adguard-configuration, key: password}
    sources:
      - service
      - ingress
    logLevel: info
    logFormat: json
    interval: 5m
    triggerLoopOnEvent: true
    policy: sync
    registry: txt
    txtOwnerId: k3s
    domainFilters:
      - x1d.uk
