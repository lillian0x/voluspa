apiVersion: apps/v1
kind: Deployment
metadata:
  name: ntfy
  namespace: ntfy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ntfy
  template:
    metadata:
      labels:
        app: ntfy
    spec:
      containers:
        - name: ntfy
          image: binwiederhier/ntfy:v2.27.0
          args:
            - serve
          ports:
            - containerPort: 80
              name: http
          envFrom:
            - secretRef:
                name: ntfy-secret
          volumeMounts:
            - name: config-volume
              mountPath: /etc/ntfy/server.yml
              subPath: server.yml
            - name: ntfy-data
              mountPath: /var/cache/ntfy
      volumes:
        - name: config-volume
          configMap:
            name: ntfy-config
        - name: ntfy-data
          persistentVolumeClaim:
            claimName: ntfy-pvc
