apiVersion: apps/v1
kind: Deployment
metadata:
  name: nak
  labels:
    app: nak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nak
  template:
    metadata:
      labels:
        app: nak
    spec:
      containers:
      - name: nak
        image: fiatjaf/nak:latest
        command: ["nak", "bunker"]
        args:
          - "--sec"
          - "$(NOSTR_SECRET_KEY)"
          - "--relay"
          - "wss://relay.damus.io"
          - "--relay"
          - "wss://nos.lol"
        env:
        - name: NOSTR_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: nak
              key: NOSTR_SECRET_KEY
        resources:
          requests:
            memory: "32Mi"
            cpu: "10m"
          limits:
            memory: "64Mi"
            cpu: "100m"
