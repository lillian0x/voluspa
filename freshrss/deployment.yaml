apiVersion: apps/v1
kind: Deployment
metadata:
  name: freshrss
  namespace: freshrss
spec:
  replicas: 1
  selector:
    matchLabels:
      app: freshrss
  template:
    metadata:
      labels:
        app: freshrss
    spec:
      containers:
        - name: freshrss
          image: freshrss/freshrss:latest
          env:
            - name: TZ
              value: "Asia/Tokyo"
            - name: CRON_MIN
              value: "*/20"
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: freshrss-volume
              mountPath: /var/www/FreshRSS/data
              subPath: data
            - name: freshrss-volume
              mountPath: /var/www/FreshRSS/extensions
              subPath: extensions
      volumes:
        - name: freshrss-volume
          persistentVolumeClaim:
            claimName: freshrss-app-pvc
