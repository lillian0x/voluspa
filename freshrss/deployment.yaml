apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: freshrss-app-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: freshrss
  namespace: freshrss
spec:
  replicas: 1
  selector:
    matchLabels:
      app: freshrss
  template:
    metadata:
      labels:
        app: freshrss
    spec:
      containers:
        - name: freshrss
          image: freshrss/freshrss:latest
          env:
            - name: TZ
              value: "Asia/Tokyo"
            - name: CRON_MIN
              value: "*/20"
            - name: FRESHRSS_DB_TYPE
              value: "pgsql"
            - name: FRESHRSS_DB_HOST
              value: "freshrss-postgres-rw.freshrss.svc.cluster.local"
            - name: FRESHRSS_DB_BASE
              value: "freshrss"
            - name: FRESHRSS_DB_USER
              value: "freshrss"
            - name: FRESHRSS_DB_PASS
              valueFrom:
                secretKeyRef:
                  name: freshrss-postgres-app
                  key: password
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: freshrss-volume
              mountPath: /var/www/FreshRSS/data
              subPath: data
            - name: freshrss-volume
              mountPath: /var/www/FreshRSS/extensions
              subPath: extensions
      volumes:
        - name: freshrss-volume
          persistentVolumeClaim:
            claimName: freshrss-app-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: freshrss
spec:
  ports:
    - port: 80
      targetPort: http
  selector:
    app: freshrss
