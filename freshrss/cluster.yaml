apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: freshrss-postgres
  namespace: freshrss
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:16.3
  instances: 1
  bootstrap:
    initdb:
      database: freshrss
      owner: freshrss
  storage:
    size: 5Gi
    pvcTemplate:
      spec:
        accessModes:
          - ReadWriteOnce
        volumeName: freshrss-postgres-pv
        storageClassName: ""
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
