apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: metube
  namespace: metube
spec:
  ingressClassName: cloudflare-tunnel
  rules:
    - host: metube.lillian0x.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: metube
                port:
                  number: 80
