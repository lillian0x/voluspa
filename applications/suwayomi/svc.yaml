apiVersion: v1
kind: Service
metadata:
  name: suwayomi
  namespace: suwayomi
  annotations:
    external-dns.alpha.kubernetes.io/hostname: app.example.com
    external-dns.alpha.kubernetes.io/ttl: "300"
spec:
  type: LoadBalancer
  selector:
    app: suwayomi
  ports:
    - name: http
      port: 80
      targetPort: 4567
