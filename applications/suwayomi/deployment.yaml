apiVersion: apps/v1
kind: Deployment
metadata:
  name: suwayomi
  namespace: suwayomi
  labels:
    app: suwayomi
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: suwayomi
  template:
    metadata:
      labels:
        app: suwayomi
    spec:
      containers:
        - name: suwayomi
          image: ghcr.io/suwayomi/suwayomi-server:stable
          ports:
            - name: http
              containerPort: 4567
          env:
            - name: TZ
              value: "Asia/Tokyo"
            - name: AUTH_MODE
              value: "none"
          volumeMounts:
            - name: data
              mountPath: /home/suwayomi/.local/share/Tachidesk
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1536Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 4567
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 4567
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: suwayomi-data
