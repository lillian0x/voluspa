apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: connector-to-dashy
  namespace: cloudflare-tunnel-system
spec:
  podSelector:
    matchLabels:
      app: controlled-cloudflared-connector
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: dashy
          podSelector:
            matchLabels:
              app: dashy
      ports:
        - {protocol: TCP, port: 8080}
