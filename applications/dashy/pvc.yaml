apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dashy-data
  namespace: dashy
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: proxmox-data-xfs
  volumeAttributesClassName: proxmox-data-xfs-backup
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dashy-data-longhorn
  namespace: dashy
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
