apiVersion: v1
kind: Service
metadata:
  name: openwebui
  namespace: openwebui
spec:
  selector:
    app: openwebui
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: llama-server
  namespace: openwebui
spec:
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Endpoints
metadata:
  name: llama-server
  namespace: openwebui
subsets:
  - addresses:
      - ip: 192.168.0.105
    ports:
      - port: 8080
