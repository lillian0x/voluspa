apiVersion: v1
kind: ConfigMap
metadata:
  name: paperless-config
  namespace: paperless
data:
  PAPERLESS_URL: "https://paperless.x1d.uk"
  PAPERLESS_ALLOWED_HOSTS: "paperless.x1d.uk"
  PAPERLESS_CORS_ALLOWED_HOSTS: "https://paperless.x1d.uk"
  PAPERLESS_CSRF_TRUSTED_ORIGINS: "https://paperless.x1d.uk"
  PAPERLESS_PROXY_SSL_HEADER: '["HTTP_X_FORWARDED_PROTO", "https"]'
  PAPERLESS_USE_X_FORWARD_HOST: "true"
  PAPERLESS_ENABLE_HTTP_REMOTE_USER: "false"
  PAPERLESS_ACCOUNT_ALLOW_SIGNUPS: "false"
  PAPERLESS_DB_OPTIONS: '{"timeout": 60}'
  PAPERLESS_DATA_DIR: /usr/src/paperless/data
  PAPERLESS_MEDIA_ROOT: /usr/src/paperless/media
  PAPERLESS_CONSUMPTION_DIR: /usr/src/paperless/consume
  PAPERLESS_TIME_ZONE: Asia/Tokyo
  PYTHONDONTWRITEBYTECODE: "1" # .pyc をイメージ内に書かない
  PAPERLESS_OCR_LANGUAGE: eng
  PAPERLESS_WEBSERVER_WORKERS: "1"
  PAPERLESS_TASK_WORKERS: "1" # SQLiteの書き込みロック競合を避ける
