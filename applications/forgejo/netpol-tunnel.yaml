apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: connector-to-forgejo
  namespace: cloudflare-tunnel-system
spec:
  podSelector:
    matchLabels:
      app: controlled-cloudflared-connector
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: forgejo
          podSelector:
            matchLabels:
              app: forgejo
      ports:
        - protocol: TCP
          port: 3000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-cloudflared
  namespace: forgejo
spec:
  podSelector:
    matchLabels:
      app: forgejo
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudflare-tunnel-system
          podSelector:
            matchLabels:
              app: controlled-cloudflared-connector
      ports:
        - protocol: TCP
          port: 3000
