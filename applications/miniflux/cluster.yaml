apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: miniflux-db
  namespace: miniflux
spec:
  instances: 1
  storage:
    size: 5Gi
    storageClass: longhorn
  plugins:
  - name: barman-cloud.cloudnative-pg.io
    isWALArchiver: true
    parameters:
      barmanObjectName: rustfs-store
      serverName: miniflux-db-longhorn
  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "1"
      memory: "512Mi"
  bootstrap:
    recovery:
      database: miniflux
      owner: miniflux
      source: miniflux-db-source
  externalClusters:
    - name: miniflux-db-source
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: rustfs-store
          serverName: miniflux-db
