apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: db-ingress
  namespace: miniflux
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: miniflux-db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: miniflux
      ports:
        - {protocol: TCP, port: 5432}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudnative-pg
      ports:
        - {protocol: TCP, port: 5432}
        - {protocol: TCP, port: 8000}
    - from:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: miniflux-db
      ports:
        - {protocol: TCP, port: 5432}
        - {protocol: TCP, port: 8000}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: db-egress
  namespace: miniflux
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: miniflux-db
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 192.168.0.103/32
      ports:
        - {protocol: TCP, port: 6443}
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: miniflux-db
      ports:
        - {protocol: TCP, port: 5432}
        - {protocol: TCP, port: 8000}
    - to:
        - ipBlock:
            cidr: 192.168.10.104/32
      ports:
        - {protocol: TCP, port: 9000}
