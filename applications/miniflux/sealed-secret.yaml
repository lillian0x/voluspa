apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: miniflux-secret
  namespace: miniflux
spec:
  encryptedData:
    OAUTH2_CLIENT_SECRET: 
  template:
    metadata:
      name: miniflux-secret
      namespace: miniflux
---
