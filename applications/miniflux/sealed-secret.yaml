kind: SealedSecret
metadata:
  name: rustfs-creds
  namespace: miniflux
spec:
  encryptedData:
    ACCESS_KEY_ID: 
    ACCESS_SECRET_KEY: 
  template:
    metadata:
      name: rustfs-creds
      namespace: miniflux
