apiVersion: apps/v1
kind: Deployment
metadata:
  name: miniflux
  namespace: miniflux
spec:
  replicas: 1
  selector:
    matchLabels:
      app: miniflux
  template:
    metadata:
      labels:
        app: miniflux
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
      containers:
        - name: miniflux
          image: miniflux/miniflux:2.3.3
          resources:
            requests:
              memory: 64Mi
              cpu: 1m
            limits:
              memory: 128Mi
          securityContext:
            readOnlyRootFilesystem: true
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: miniflux-db-app
                  key: uri
          envFrom:
            - configMapRef:
                name: miniflux-config
            - secretRef:
                name: miniflux-secret
