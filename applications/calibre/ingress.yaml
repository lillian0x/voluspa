apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: calibre
  namespace: calibre
spec:
  ingressClassName: cloudflare-tunnel
  rules:
    - host: calibre.x1d.uk
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: calibre
                port:
                  number: 80
