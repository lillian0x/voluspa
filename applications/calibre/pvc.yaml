apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: calibre-web-config-data
  namespace: calibre
spec:
  storageClassName: proxmox-data-xfs
  volumeAttributesClassName: proxmox-data-xfs-backup
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: calibre-config
  namespace: calibre
spec:
  storageClassName: longhorn
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
