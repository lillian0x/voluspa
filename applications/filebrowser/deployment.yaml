apiVersion: apps/v1
kind: Deployment
metadata:
  name: filebrowser
  namespace: filebrowser
  labels:
    app: filebrowser
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: filebrowser
  template:
    metadata:
      labels:
        app: filebrowser
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: filebrowser
          image: gtstef/filebrowser:1.5.8-stable
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              memory: "512Mi"
          securityContext:
            readOnlyRootFilesystem: true
          ports:
            - containerPort: 80
          envFrom:
            - secretRef:
                name: filebrowser-secret
          volumeMounts:
            - name: config
              mountPath: /home/filebrowser/data/config.yaml
              subPath: config.yaml
            - name: data
              mountPath: /srv
            - name: database
              mountPath: /database
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          nfs:
            server: 192.168.10.104
            path: /mnt/hdd
        - name: database
          persistentVolumeClaim:
            claimName: filebrowser-db
        - name: config
          configMap:
            name: filebrowser-config
        - name: tmp
          emptyDir: {}
