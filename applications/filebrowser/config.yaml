apiVersion: v1
kind: ConfigMap
metadata:
  name: filebrowser-config
  namespace: filebrowser
data:
  config.yaml: |
    server:
      database:
        path: "/database/filebrowser.sqlite"
        migrateFrom: "/database/filebrowser.db"
      cacheDir: /tmp
      sources:
        - path: /srv
          name: "NFS Share"
          config:
            defaultEnabled: true
            defaultUserScope: "/share"
    http:
      port: 8080
      trustProxyHeaders: true
    auth:
      methods:
        oidc:
          enabled: true
          clientId: "007aef65-57c3-4dce-8b3d-ae8b62c20219"
          issuerUrl: "https://auth.x1d.uk"
          scopes: "openid email profile groups"
          adminGroup: "admin"
        password:
          enabled: false
