apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImagePolicy
metadata:
  name: radicale-policy
  namespace: radicale
spec:
  imageRepositoryRef:
    name: radicale-repository
  filterTags:
    # 3.1.8.0 から先頭の '3.1.8' だけを抽出する正規表現
    pattern: '^(?P<version>[0-9]+\.[0-9]+\.[0-9]+)\.[0-9]+$'
    extract: '$version'
  policy:
    semver:
      range: '>=3.7.0'
