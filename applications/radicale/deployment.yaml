apiVersion: apps/v1
kind: Deployment
metadata:
  name: radicale
  namespace: radicale
spec:
  replicas: 1
  selector:
    matchLabels:
      app: radicale
  template:
    metadata:
      labels:
        app: radicale
    spec:
      containers:
      - name: radicale
        image: tomsquest/docker-radicale:3.8.0.0
        resources:
            requests:
              memory: 64Mi
              cpu: 1m
            limits:
              memory: 128Mi
        ports:
        - containerPort: 5232
        env:
          - name: RADICALE_CONFIG_SERVER_HOSTS
            value: "0.0.0.0:5232"
          - name: RADICALE_CONFIG_AUTH_TYPE
            value: "htpasswd"
        volumeMounts:
        - name: data
          mountPath: /data
        - name: auth
          mountPath: /etc/radicale/users
          subPath: users
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: radicale-data
      - name: auth
        secret:
          secretName: radicale-auth
