authentik:
  secret_key: "${SECRET_KEY}"
  postgresql:
    host: "authentik-postgres-rw"
    name: "authentik"
    user: "authentik"
server:
  replicas: 2
  env:
    - name: AUTHENTIK_POSTGRESQL__PASSWORD
      valueFrom:
        secretKeyRef:
          name: "authentik-postgres-app"
          key: "password"
  ingress:
    enabled: true
    hosts:
      - auth.lillian0x.com
    tls:
      - secretName: authentik-tls
        hosts:
          - auth.lillian0x.com
worker:
  replicas: 2
postgresql:
  enabled: false
