authentik:
  secret_key: "${SECRET_KEY}"
  postgresql:
    host: "authentik-postgres-rw"
    name: "authentik"
    user: "authentik"
global:
  env:
    - name: AUTHENTIK_POSTGRESQL__PASSWORD
      valueFrom:
        secretKeyRef:
          name: "authentik-postgres-app"
          key: "password"
server:
  replicas: 2
  ingress:
    enabled: true
    hosts:
      - auth.lillian0x.com
    tls:
      - secretName: authentik-tls
        hosts:
          - auth.lillian0x.com
  resources:
    requests:
      memory: "512Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
worker:
  replicas: 2
  resources:
    requests:
      memory: "512Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
postgresql:
  enabled: false
