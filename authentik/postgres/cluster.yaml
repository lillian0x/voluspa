apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: authentik-postgres
  namespace: authentik
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:16.3
  instances: 1
  bootstrap:
    initdb:
      database: authentik
      owner: authentik
  storage:
    size: 20Gi
    pvcTemplate:
      spec:
        accessModes:
          - ReadWriteOnce
        volumeName: authentik-postgres-pv
        storageClassName: ""
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
