apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudflare-tunnel
  namespace: flux-system
spec:
  interval: 10m
  path: ./infrastructure/cloudflare-tunnel-ingress-controller
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
---
