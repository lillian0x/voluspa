apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dashy
  namespace: flux-system
spec:
  interval: 5m
  path: ./applications/dashy
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
