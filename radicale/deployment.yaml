apiVersion: apps/v1
kind: Deployment
metadata:
  name: radicale
  namespace: radicale
spec:
  replicas: 1
  selector:
    matchLabels:
      app: radicale
  template:
    metadata:
      labels:
        app: radicale
    spec:
      containers:
      - name: radicale
        image: tomsquest/docker-radicale:latest
        ports:
        - containerPort: 5232
        volumeMounts:
        - name: data
          mountPath: /data
        - name: config
          mountPath: /etc/radicale/config
          subPath: config
        - name: auth
          mountPath: /etc/radicale/users
          subPath: users
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: radicale-data
      - name: config
        configMap:
          name: radicale-config
      - name: auth
        secret:
          secretName: radicale-auth
