  name: radicale
  namespace: radicale
spec:
  ingressClassName: cloudflare-tunnel
  rules:
    - host: radicale.lillian0x.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: radicale
                port:
                  number: 80
