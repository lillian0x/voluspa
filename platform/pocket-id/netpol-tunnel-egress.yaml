apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: connector-to-pocket-id
  namespace: cloudflare-tunnel-system
spec:
  podSelector:
    matchLabels:
      app: controlled-cloudflared-connector
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: pocket-id
          podSelector:
            matchLabels:
              app: pocket-id
      ports:
        - {protocol: TCP, port: 1411}
