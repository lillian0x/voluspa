apiVersion: v1
kind: ConfigMap
metadata:
  name: rauthy-config
  namespace: rauthy
data:
  config.toml: |
    [bootstrap]
    admin_email = "admin@localhost"
    [cluster]
    node_id = 1
    nodes = [
        "1 localhost:8100 localhost:8200",
        #    "2 localhost:8101 localhost:8201",
        #    "3 localhost:8102 localhost:8202",
    ]
    [server]
    scheme = "http"
    pub_url = "auth.x1d.uk"
    proxy_mode = false
    [webauthn]
    rp_id = "auth.x1d.uk"
    rp_origin = "https://auth.x1d.uk:443"
