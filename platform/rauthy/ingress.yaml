apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rauthy
  namespace: rauthy
spec:
  ingressClassName: cloudflare-tunnel
  rules:
    - host: auth.x1d.uk
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rauthy
                port:
                  number: 80
