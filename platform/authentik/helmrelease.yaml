apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: authentik
spec:
  interval: 30m
  chart:
    spec:
      chart: authentik
      sourceRef:
        kind: HelmRepository
        name: authentik
  values:
    authentik:
      secret_key:
        secretKeyRef:
          name: authentik-secret
          key: AUTHENTIK_SECRET_KEY
      postgresql:
        host:
          secretKeyRef:
            name: authentik-db-app
            key: host
        password:
          secretKeyRef:
            name: authentik-db-app
            key: password
    server:
      ingress:
        enabled: true
        ingressClassName: cloudflare-tunnel
        hosts:
          - auth.x1d.uk
