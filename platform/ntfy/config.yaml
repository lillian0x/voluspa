apiVersion: v1
kind: ConfigMap
metadata:
  name: ntfy-config
  namespace: ntfy
data:
  server.yml: |
    # Server
    base-url: "https://ntfy.x1d.uk"
    
    # Access control
    auth-file: "/var/cache/ntfy/auth.db"
    auth-default-access: "deny-all"
    auth-access:
      - "*:up*:write-only"
    enable-login: true
    require-login: true
    
    # Message cache
    cache-file: "/var/cache/ntfy/cache.db"
    
    # Upstream
    upstream-base-url: "https://ntfy.sh"
