apiVersion: apps/v1
kind: Deployment
metadata:
  name: pihole
  namespace: pihole
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pihole
  template:
    metadata:
      labels:
        app: pihole
    spec:
      automountServiceAccountToken: false
      initContainers:
      - name: fix-permissions
        image: busybox:1.38
        command: ["sh", "-c", "chown -R 0:0 /etc/pihole /etc/dnsmasq.d"]
        volumeMounts:
          - {name: etc-pihole, mountPath: /etc/pihole}
          - {name: etc-dnsmasq, mountPath: /etc/dnsmasq.d}
      containers:
        - name: pihole
          image: pihole/pihole:2026.09.0
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add:
                - CHOWN
                - NET_BIND_SERVICE
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: TZ
              value: "Asia/Tokyo"
            - name: DNSMASQ_USER
              value: "root"
            - name: FTLCONF_LOCAL_IPV4
              value: "192.168.0.240"
          ports:
            - {containerPort: 53, protocol: TCP}
            - {containerPort: 53, protocol: UDP}
            - {containerPort: 80, protocol: TCP}
            - {containerPort: 443, protocol: TCP}
          volumeMounts:
            - name: etc-pihole
              mountPath: /etc/pihole
            - name: etc-dnsmasq
              mountPath: /etc/dnsmasq.d
      volumes:
        - name: etc-pihole
          persistentVolumeClaim:
            claimName: pihole-etc-pvc
        - name: etc-dnsmasq
          persistentVolumeClaim:
            claimName: pihole-dnsmasq-pvc
