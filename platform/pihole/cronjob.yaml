apiVersion: batch/v1
kind: CronJob
metadata:
  name: pihole-gravity-update
  namespace: pihole
spec:
  schedule: "30 3 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: gravity-update
              image: pihole/pihole:2026.09.0
              command: ["pihole", "-g"]
              volumeMounts:
                - {name: etc-pihole, mountPath: /etc/pihole}
                - {name: etc-dnsmasq, mountPath: /etc/dnsmasq.d}
          volumes:
            - {name: etc-pihole, persistentVolumeClaim: {claimName: pihole-etc-pvc}}
            - {name: etc-dnsmasq, persistentVolumeClaim: {claimName: pihole-dnsmasq-pvc}}
