apiVersion: apps/v1
kind: Deployment
metadata:
  name: metube
  namespace: metube
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metube
  template:
    metadata:
      labels:
        app: metube
    spec:
      containers:
        - name: metube
          image: ghcr.io/alexta69/metube:latest
          ports:
            - containerPort: 8081
          env:
            - name: DOWNLOAD_DIR
              value: /downloads
            - name: STATE_DIR
              value: /downloads/.metube
            - name: YTDL_OPTIONS
              value: >
                {

                  "format": "bv*+ba/b",
                  "writesubtitles": true,
                  "writeautomaticsub": true
                }

          volumeMounts:
            - name: downloads
              mountPath: /downloads
      volumes:
        - name: downloads
          persistentVolumeClaim:
            claimName: metube-downloads
